syntax = "proto3";

package openfga.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

// Object represents an OpenFGA Object.
//
// An Object is composed of a type and identifier (e.g. 'document:1')
//
// See https://openfga.dev/docs/concepts#what-is-an-object
message Object {
  string type = 1 [
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,254}$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"document\""}
  ];

  string id = 2 [
    (validate.rules).string = {
      pattern: "[^#:\\s]+$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"0bcdf6fa-a6aa-4730-a8eb-9cf172ff16d9\""}
  ];
}

// User.
//
// Represents any possible value for a user (subject or principal). Can be a:
// - Specific user object e.g.: 'user:will', 'folder:marketing', 'org:contoso', ...)
// - Specific userset (e.g. 'group:engineering#member')
// - Public-typed wildcard (e.g. 'user:*')
//
// See https://openfga.dev/docs/concepts#what-is-a-user
message User {
  oneof user {
    Object object = 1;
    UsersetUser userset = 2;
    TypedWildcard wildcard = 3;
  }
}

// Userset.
//
// A set or group of users, represented in the `<type>:<id>#<relation>` format
//
// `group:fga#member` represents all members of group FGA, not to be confused by `group:fga` which represents the group itself as a specific object.
//
// See: https://openfga.dev/docs/modeling/building-blocks/usersets#what-is-a-userset
message UsersetUser {
  string type = 1 [
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,254}$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"group\""}
  ];

  string id = 2 [
    (validate.rules).string = {
      pattern: "[^#:\\s]+$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"fga\""}
  ];

  string relation = 3 [
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,50}$"
      ignore_empty: true
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"member\""}
  ];
}

// RelationshipCondition attaches an ABAC condition to a relationship tuple, making the
// relationship it's attached to conditional: the relationship only holds when the named
// `Condition`'s CEL expression evaluates to true.
//
// `context` on this message is optional and is typically used to pin parameter values that are
// fixed for the lifetime of the tuple (e.g. `grant_time`/`grant_duration` for a time-limited
// grant), as opposed to parameters that vary per request (e.g. `current_time`), which are instead
// supplied via the top-level `context` on Check/ListObjects/ListUsers requests.
//
// When a relationship is evaluated, this tuple-level `context` is merged with any request-level
// `context`; if the same key is present in both, the value from this tuple's `context` wins.
message RelationshipCondition {
  // A reference (by name) of the relationship condition defined in the authorization model.
  string name = 1 [
    (validate.rules).string = {
      pattern: "^[^\\s]{2,256}$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 256
      example: "\"condition1\""
    }
  ];

  // Additional context/data to persist along with the condition.
  // The keys must match the parameters defined by the condition, and the value types must
  // match the parameter type definitions.
  google.protobuf.Struct context = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "{\"grant_time\": \"2021-10-11T09:00:00Z\", \"grant_duration\": \"1h\"}"}];
}

// TupleKeyWithoutCondition identifies a relationship tuple by its user/relation/object triplet
// only, with no `RelationshipCondition`. It's used where a condition would be meaningless or
// ignored: deleting a tuple (`WriteRequestDeletes.tuple_keys`) only needs the triplet to find the
// matching row, and any `condition` on the delete request itself is ignored by the Write API.
message TupleKeyWithoutCondition {
  string user = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {max_bytes: 512},
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 512
      example: "\"user:anne\""
    }
  ];

  string relation = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,50}$"
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 50
      example: "\"reader\""
    }
  ];

  string object = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      pattern: "^[^\\s]{2,256}$"
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 256
      example: "\"document:2021-budget\""
    }
  ];
}

// Type bound public access.
//
// Normally represented using the `<type>:*` syntax
//
// `employee:*` represents every object of type `employee`, including those not currently present in the system
//
// See https://openfga.dev/docs/concepts#what-is-type-bound-public-access
message TypedWildcard {
  string type = 1 [
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,254}$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"employee\""}
  ];
}

// TupleKey identifies a relationship tuple by its user/relation/object triplet, optionally with a
// `condition` that makes the relationship it describes conditional (ABAC). This is the shape used
// when writing tuples and when specifying `contextual_tuples`; a stored tuple returned by the Read
// or ReadChanges APIs is wrapped in a `Tuple`, which pairs a `TupleKey` (including its `condition`,
// if any) with the tuple's write timestamp.
message TupleKey {
  string user = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      max_bytes: 512
      ignore_empty: false
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 512
      example: "\"user:anne\""
    }
  ];

  string relation = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,50}$"
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 50
      example: "\"reader\""
    }
  ];

  string object = 3 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {
      pattern: "^[^\\s]{2,256}$"
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      max_length: 256
      example: "\"document:2021-budget\""
    }
  ];

  RelationshipCondition condition = 4;
}

// Tuple pairs a stored relationship (`TupleKey`, including its `condition` if it was written with
// one) with the timestamp it was written at. This is the shape returned by the Read API; note that
// Read returns the tuple's condition verbatim without evaluating it.
message Tuple {
  TupleKey key = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).message.required = true
  ];
  google.protobuf.Timestamp timestamp = 2 [(google.api.field_behavior) = REQUIRED];
}

message TupleKeys {
  repeated TupleKey tuple_keys = 1 [
    json_name = "tuple_keys",
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).repeated.min_items = 1,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {min_items: 1}
  ];
}

message ContextualTupleKeys {
  repeated TupleKey tuple_keys = 1 [
    json_name = "tuple_keys",
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).repeated.max_items = 100,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {max_items: 100}
  ];
}

// A UsersetTree contains the result of an Expansion.
message UsersetTree {
  // A leaf node contains either
  // - a set of users (which may be individual users, or usersets
  //   referencing other relations)
  // - a computed node, which is the result of a computed userset
  //   value in the authorization model
  // - a tupleToUserset nodes, containing the result of expanding
  //   a tupleToUserset value in a authorization model.
  message Leaf {
    oneof value {
      Users users = 1;
      Computed computed = 2;
      TupleToUserset tuple_to_userset = 3;
    }
  }

  message Nodes {
    repeated Node nodes = 1 [(google.api.field_behavior) = REQUIRED];
  }

  message Users {
    repeated string users = 1 [(google.api.field_behavior) = REQUIRED];
  }

  message Computed {
    string userset = 1 [
      (google.api.field_behavior) = REQUIRED,
      (validate.rules).string = {ignore_empty: false}
    ];
  }

  message TupleToUserset {
    string tupleset = 1 [
      (google.api.field_behavior) = REQUIRED,
      (validate.rules).string = {ignore_empty: false}
    ];
    repeated Computed computed = 2 [(google.api.field_behavior) = REQUIRED];
  }

  message Difference {
    Node base = 1 [
      (google.api.field_behavior) = REQUIRED,
      (validate.rules).message.required = true
    ];
    Node subtract = 2 [
      (google.api.field_behavior) = REQUIRED,
      (validate.rules).message.required = true
    ];
  }

  message Node {
    string name = 1 [(google.api.field_behavior) = REQUIRED];
    oneof value {
      Leaf leaf = 2;
      Difference difference = 5;
      Nodes union = 6;
      Nodes intersection = 7;
    }
  }

  Node root = 1;
}

// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum TupleOperation {
  TUPLE_OPERATION_WRITE = 0;
  TUPLE_OPERATION_DELETE = 1;
}

message TupleChange {
  TupleKey tuple_key = 1 [
    json_name = "tuple_key",
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).message.required = true
  ];
  TupleOperation operation = 2 [
    (validate.rules).enum.defined_only = true,
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.Timestamp timestamp = 3 [(google.api.field_behavior) = REQUIRED];
}

message Store {
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {ignore_empty: false}
  ];
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (validate.rules).string = {ignore_empty: false}
  ];
  google.protobuf.Timestamp created_at = 3 [
    json_name = "created_at",
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.Timestamp updated_at = 4 [
    json_name = "updated_at",
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.Timestamp deleted_at = 5 [json_name = "deleted_at"];
}

message UserTypeFilter {
  string type = 1 [
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,254}$"
      ignore_empty: false
    },
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"group\""}
  ];

  string relation = 2 [
    (validate.rules).string = {
      pattern: "^[^:#@\\s]{1,50}$"
      ignore_empty: true
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"member\""}
  ];
}
